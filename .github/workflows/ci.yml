name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job writes to the repository, and none gets a token that could. Do not
# add `pull_request_target`: it would run untrusted PR code with this repository's secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A skipped gtk or linux test fails the run, so the sandbox and GTK tests cannot pass by
  # skipping (tests/plugins/host.py, ARCHITECTURE section 11).
  TUMBLEWEED_CI: "1"

jobs:
  linux:
    name: Linux (full suite in the container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Docker build-context test (no secret can reach an image layer) needs a real Docker
      # daemon, which the container does not have, so it runs here on the runner: the locked dev
      # tools, without building PyGObject. TUMBLEWEED_REQUIRE_DOCKER makes a missing daemon fail
      # the step instead of skipping the test.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1" # keep in step with the Dockerfile
          enable-cache: false

      - name: Docker build context, checked against the real Docker
        env:
          TUMBLEWEED_REQUIRE_DOCKER: "1"
        run: |
          uv sync --locked --no-install-project --no-install-package pygobject --no-install-package pycairo
          uv run --no-sync python -m pytest --no-cov tests/test_docker_context.py -rs

      # Ubuntu 24.04 runners block unprivileged user namespaces with AppArmor, and bubblewrap
      # needs them (ARCHITECTURE section 11).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The same image and docker flags as a developer's `scripts/test-linux`. Its log shows the
      # `bwrap --unshare-all --die-with-parent ...` check and the headless GTK widget.
      - name: Run the full suite in the Linux image
        run: scripts/test-linux

  macos:
    name: macOS (platform-neutral subset, Python ${{ matrix.python }})
    runs-on: macos-15 # Apple Silicon, like the development machines
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor, and every newer Python the dependencies support. Behaviour that differs
        # between versions (Path.resolve on a symlink loop or an unsearchable directory) is why
        # more than one version runs. On 3.14 the gtk smoke test fails: PyGObject's gi.events uses
        # asyncio.AbstractEventLoopPolicy, deprecated there, and warnings are errors in our tests.
        # This job deselects gtk tests, so that is not exercised here (a developer on 3.14 sees it
        # locally; .python-version pins 3.12). Revisit when PyGObject fixes it.
        python: ["3.12", "3.13", "3.14"]
    env:
      # Beats .python-version for every uv command in the job, `uv run` included.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/test_lock.py dates uv.lock by its last commit, and a shallow
          # clone would date it by the checkout, which makes the cooldown check vacuous.
          fetch-depth: 0

      # The README's setup, so that its instructions are tested too. PyGObject builds against these.
      - name: Install GTK
        run: brew install gtk4 libadwaita gobject-introspection pkg-config cairo

      # Homebrew's libraries are not on dyld's default search path on Apple Silicon, and the GTK
      # typelibs name them without a path, so PyGObject cannot load them otherwise (README).
      - name: Make Homebrew's libraries findable
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1" # keep in step with the Dockerfile
          enable-cache: false

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Python version
        run: uv run python --version

      # Needs no display: proves the README's setup produced a working PyGObject and GTK 4.
      - name: PyGObject loads GTK 4
        run: >-
          uv run python -c "import gi; gi.require_version('Gtk', '4.0');
          from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())"

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports

      # gtk and linux tests need a display and a Linux kernel: the Linux job runs those.
      - name: Tests
        run: uv run pytest -m "not gtk and not linux and not btrfs and not live"
