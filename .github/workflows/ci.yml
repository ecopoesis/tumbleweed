name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job writes to the repository, and none gets a token that could. Do not
# add `pull_request_target`: it would run untrusted PR code with this repository's secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A skipped gtk or linux test fails the run, so the sandbox and GTK tests cannot pass by
  # skipping (tests/plugins/host.py, ARCHITECTURE section 11).
  TUMBLEWEED_CI: "1"

jobs:
  linux:
    name: Linux (full suite in the container)
    runs-on: ubuntu-24.04
    # The image build plus the full suite took 28-29 minutes on main by S22 and grows with every
    # step, so 30 cancelled runs that were passing (#161). Hangs are still caught per test by
    # pytest-timeout (120 s).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Docker build-context test (no secret can reach an image layer) needs a real Docker
      # daemon, which the container does not have, so it runs here on the runner: the locked dev
      # tools, without building PyGObject. TUMBLEWEED_REQUIRE_DOCKER makes a missing daemon fail
      # the step instead of skipping the test.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1" # keep in step with the Dockerfile
          enable-cache: false

      - name: Docker build context, checked against the real Docker
        env:
          TUMBLEWEED_REQUIRE_DOCKER: "1"
        run: |
          uv sync --locked --no-install-project --no-install-package pygobject --no-install-package pycairo
          uv run --no-sync python -m pytest --no-cov tests/test_docker_context.py -rs

      # Ubuntu 24.04 runners block unprivileged user namespaces with AppArmor, and bubblewrap
      # needs them (ARCHITECTURE section 11).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The same image and docker flags as a developer's `scripts/test-linux`. Its log shows the
      # `bwrap --unshare-all --die-with-parent ...` check and the headless GTK widget.
      - name: Run the full suite in the Linux image
        run: scripts/test-linux

  macos:
    name: macOS (platform-neutral subset, Python ${{ matrix.python }})
    runs-on: macos-15 # Apple Silicon, like the development machines
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor, and every newer Python the dependencies support. Behaviour that differs
        # between versions (Path.resolve on a symlink loop or an unsearchable directory) is why
        # more than one version runs. On 3.14 the gtk smoke test fails: PyGObject's gi.events uses
        # asyncio.AbstractEventLoopPolicy, deprecated there, and warnings are errors in our tests.
        # This job deselects gtk tests, so that is not exercised here (a developer on 3.14 sees it
        # locally; .python-version pins 3.12). Revisit when PyGObject fixes it: #47.
        python: ["3.12", "3.13", "3.14"]
    env:
      # Beats .python-version for every uv command in the job, `uv run` included.
      UV_PYTHON: ${{ matrix.python }}
      # The lock-age check needs the full git history (fetch-depth: 0 below). With this set, a
      # checkout that lost it fails the check instead of skipping it quietly (tests/test_lock.py).
      TUMBLEWEED_REQUIRE_GIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/test_lock.py dates uv.lock by its last commit, and a shallow
          # clone would date it by the checkout, which makes the cooldown check vacuous.
          fetch-depth: 0

      # The README's setup, so that its instructions are tested too. PyGObject builds against these.
      - name: Install GTK
        run: brew install gtk4 libadwaita gobject-introspection pkg-config cairo

      # Homebrew's libraries are not on dyld's default search path on Apple Silicon, and the GTK
      # typelibs name them without a path, so PyGObject cannot load them otherwise (README).
      - name: Make Homebrew's libraries findable
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1" # keep in step with the Dockerfile
          enable-cache: false

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Python version
        run: uv run python --version

      # Needs no display: proves the README's setup produced a working PyGObject and GTK 4.
      - name: PyGObject loads GTK 4
        run: >-
          uv run python -c "import gi; gi.require_version('Gtk', '4.0');
          from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())"

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports

      # gtk and linux tests need a display and a Linux kernel: the Linux job runs those.
      - name: Tests
        run: uv run pytest -m "not gtk and not linux and not btrfs and not live"

  nix:
    name: Nix (flake check, aarch64 evaluation, the suite in nix develop)
    runs-on: ubuntu-24.04
    # In parallel with `linux`, which takes about 25 of its 45 minutes (#161). This job is the same
    # suite again, run in the dev shell (under weston), plus a cold Nix build: the store is not
    # cached between runs (an action cache would be one more thing to trust with it), so every run
    # downloads the dev shell from cache.nixos.org, about 13 GB. Hangs are still caught per test by
    # pytest-timeout (120 s).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner has little free space on / and /nix lives there. These are not used here.
      - name: Free disk space for the Nix store
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # No binary cache but cache.nixos.org (public, no secret), and no token for Nix: flake.lock pins
      # every input. Flakes are on for this job only, as in the README.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      # Builds on x86_64: the package (whose install check starts every program with --version),
      # the sandbox runtime, and the secret scans. See nix/checks.nix.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # aarch64 is evaluated, not built: the outputs of every system must evaluate, and the target's
      # package and runtime resolve to derivations.
      - name: Evaluate the aarch64 outputs
        run: |
          nix flake check --all-systems --no-build
          for output in packages.aarch64-linux.tumbleweed packages.aarch64-linux.sandbox-runtime \
              devShells.aarch64-linux.default; do
            nix eval --raw ".#${output}.drvPath"
            echo
          done

      - name: Every entry point starts (--version)
        run: |
          nix build --print-build-logs --out-link package .#tumbleweed
          for program in package/bin/*; do "$program" --version; done

      # Ubuntu 24.04 runners block unprivileged user namespaces with AppArmor, and bubblewrap
      # needs them (ARCHITECTURE section 11).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # What the image has and the runner does not: the system Python's Pillow and numpy (the tests
      # that use the system runtime, as in the Linux job), dbus-daemon, and the second user the IPC
      # tests need (the Dockerfile's `tumbleweed-peer` and its sudo rule).
      - name: Prepare the host for the sandbox and IPC tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-pil python3-numpy dbus-daemon
          # numpy links libblas.so.3 and liblapack.so.3, Debian alternatives that are links into
          # /etc/alternatives, which a sandbox's runtime does not have: link them straight to
          # their files, as the Dockerfile does.
          multiarch="$(gcc -dumpmachine)"
          for lib in libblas.so.3 liblapack.so.3; do
            target="$(readlink -f "/usr/lib/$multiarch/$lib")"
            test -f "$target"
            sudo ln -sfn "$target" "/usr/lib/$multiarch/$lib"
          done
          sudo useradd --uid 1099 --no-create-home --shell /usr/sbin/nologin tumbleweed-peer
          echo "$USER ALL=(tumbleweed-peer) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/tumbleweed-peer
          sudo chmod 0440 /etc/sudoers.d/tumbleweed-peer
          sudo visudo --check --file /etc/sudoers.d/tumbleweed-peer

      # The same display and the same guard as the Linux job: scripts/linux-session starts weston,
      # and a skipped gtk or linux test fails the run (TUMBLEWEED_CI above). The real Nix runtime
      # test (tests/sandbox/test_nix_runtime.py) cannot skip here either. Format, lint and mypy
      # run only in the Linux job, against the exact versions in uv.lock; this shell has nixpkgs'.
      - name: The suite in nix develop
        env:
          TUMBLEWEED_REQUIRE_NIX_RUNTIME: "1"
        run: |
          nix develop --command bash -euc '
            lint-imports
            scripts/linux-session pytest -rs
          '
