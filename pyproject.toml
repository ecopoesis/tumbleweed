[project]
name = "tumbleweed"
version = "0.0.0"
description = "An AI-first OS shell: voice and chat in, generated tools out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The official Claude SDK behind our `LlmProvider` protocol (DECISIONS D3, S03): streaming,
    # typed errors and the client's timeout and retry configuration, so that we do not hand-roll
    # an SSE client for the one service the agent talks to. Pure Python (pydantic, httpx2, jiter
    # and their dependencies have wheels for every platform we lock). >=1.13 is the newest release
    # inside the 7-day cooldown today (1.15.0 is younger); it uses httpx2, not httpx (#43).
    "anthropic>=1.13",
    # The SDK's HTTP library, imported directly by `agent.anthropic_provider` (a bounded transport,
    # no redirects, no environment proxies, its exception types), so it is declared, not borrowed.
    "httpx2>=2.13",
    # httpx2's own transport library, imported directly by `voice.budget` and `voice.whisper`: the
    # speech client's network backend puts one deadline on every operation of a request (D20), which
    # httpx2's per-operation timeouts cannot. Already locked, as httpx2's dependency.
    "httpcore2>=2.13",
    "pydantic>=2.11",
    # Built from source against the system GTK (Homebrew on macOS, apt in the Linux image).
    # >=3.50 was chosen for `gi.events` (D2); the agent runs its own loop on a worker thread
    # instead (D11, #47); the floor stays where it was.
    "PyGObject>=3.50",
    # Unicode grapheme-cluster segmentation (UAX 29: `\X`) for the transcript's display transform,
    # which keeps a hostile cluster from wrecking the layout. The data is upstream's, current with
    # Unicode, and covers rules (Indic conjuncts, Hangul, Extend) that tables of ours would only
    # approximate and let drift. A C extension with wheels for every platform we lock; stdlib has
    # no equivalent. See DECISIONS D10.
    "regex>=2026.9.29",
]

[project.scripts]
tumbleweed-shell = "tumbleweed.shell.launch:main"
tumbleweed-sandbox-exec = "tumbleweed.sandbox.sandbox_exec:main"
tumbleweed-render = "tumbleweed.shell.render:main"
tumbleweed-broker = "tumbleweed.broker.daemon:main"
tumbleweed-tools = "tumbleweed.broker.toolscli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "import-linter>=2.3",
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pygobject-stubs>=2.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.11",
    "types-jsonschema>=4.23",
    "types-regex>=2026.9.29",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
# The lock covers exactly the platforms we support, so an unresolvable dependency on any of
# them fails `uv lock` instead of surfacing on someone's machine later.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# Stubs for one GTK major version only (both are imported as `Gtk`): we target GTK4.
[tool.uv.config-settings-package]
pygobject-stubs = { config = "Gtk4,Gdk4" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # shadowed builtins
    "ANN",    # annotations everywhere; ANN401 bans `Any`
    "ASYNC",  # blocking calls in async code
    "B",      # bugbear
    "BLE",    # no blind `except Exception`
    "C4",     # comprehensions
    "D100",   # every module says what it owns
    "D104",   # ... and every package
    "DTZ",    # no naive datetimes
    "E",
    "F",
    "I",
    "ISC",
    "N",
    "PGH",    # no blanket `# type: ignore` / `# noqa`
    "PIE",
    "PT",     # pytest style
    "PTH",    # pathlib over os.path
    "RUF",
    "S",      # bandit
    "SIM",
    "SLF",    # no private access (SLF001); only tumbleweed.core may, see per-file-ignores
    "T20",    # no print
    "TC",     # typing-only imports under TYPE_CHECKING
    "TID",
    "UP",
    "W",
]

[tool.ruff.format]
# Each fixture line carries its own expected-error marker, so the layout is not ours to change.
exclude = ["tests/type_safety/fixtures/*.py"]

[tool.ruff.lint.per-file-ignores]
# The scalars in tumbleweed.core build validated values by writing their private slot, and
# compare through each other's private text. Nobody else may: that is how a value is forged.
"src/tumbleweed/core/**" = ["SLF001"]
"tests/core/**" = ["SLF001"]  # tests of core's internals
"tests/**" = [
    "D100",
    "D104",
    "S101",  # assert is how tests assert
]
"tests/broker/**" = ["S108"]  # the paths a sandbox is denied are the subject: /tmp
"tests/sandbox/**" = ["S108"]  # the paths of a sandbox are the subject: /tmp, /dev/shm, /workspace
"tests/type_safety/fixtures/*.py" = [
    "E501",    # marker comments make lines long
    "F841",    # the misuse is the point, not the variables
    "PTH123",
    "SIM115",
]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["tumbleweed"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"
# The negative fixtures contain deliberate type errors; tests/type_safety runs mypy on them.
exclude = ["^tests/type_safety/fixtures/"]
warn_unreachable = true
# `Any` is banned in our code (CLAUDE.md typing rule 1), also implicitly via missing stubs.
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing:skip-covered",
]
filterwarnings = ["error"]
xfail_strict = true
# No test may hang a run. The slowest tests (a cold mypy over a fixture, a Docker build of a
# scratch context) take 5 to 25 seconds, so 120 leaves a wide margin while a hang costs two
# minutes instead of the job's 30-minute limit. A test with a legitimate reason to take longer
# says so with @pytest.mark.timeout(n).
timeout = 120
markers = [
    "gtk: needs a display; runs under the headless compositor in the Linux container",
    "linux: needs Linux kernel features (bwrap, Landlock, seccomp)",
    "btrfs: needs a btrfs mount; the btrfs gate's own skip is exempt from the TUMBLEWEED_CI guard (covered by S27)",
    "live: talks to real external services; runs only with TUMBLEWEED_LIVE=1, refused under TUMBLEWEED_CI, where it also may not carry gtk or linux",
    "xfail_allowed_in_ci(reason): lets a gtk/linux test xfail under TUMBLEWEED_CI=1, which fails it otherwise; the reason must reference an issue (#123)",
]

[tool.coverage.run]
source = ["tumbleweed"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "assert_never",
    "raise NotImplementedError",
]

[tool.importlinter]
root_package = "tumbleweed"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "broker never imports agent, shell, voice, ui.gtk, gi or an LLM SDK (ARCHITECTURE section 10, I2)"
type = "forbidden"
source_modules = ["tumbleweed.broker"]
forbidden_modules = [
    "tumbleweed.agent",
    "tumbleweed.shell",
    "tumbleweed.voice",
    "tumbleweed.ui.gtk",
    "gi",
    "anthropic",
    "openai",
    "litellm",
]

# The policy core, the store and the audit log know nothing of the transport (S16, S17). Only the
# daemon layer does: `service` (which answers IPC requests), `daemon` (the server), `client`
# (the shell's side) and `toolscli` (`tumbleweed-tools`, a client of the broker). Indirect imports
# count, so nothing else may reach `ipc` through them either.
[[tool.importlinter.contracts]]
name = "the broker imports ipc only in its daemon layer: service, daemon, client and toolscli (S17, S23)"
type = "forbidden"
source_modules = ["tumbleweed.broker"]
forbidden_modules = ["tumbleweed.ipc"]
ignore_imports = [
    "tumbleweed.broker.service -> tumbleweed.ipc.**",
    "tumbleweed.broker.daemon -> tumbleweed.ipc.**",
    "tumbleweed.broker.client -> tumbleweed.ipc.**",
    "tumbleweed.broker.toolscli -> tumbleweed.ipc.**",
]

# `service` is exempt from the contract above, so something below it importing `service` would
# reach `ipc` through it. The modules below the daemon layer may not import it. A test
# (tests/broker/test_layering.py) checks that this list names every module of the package.
[[tool.importlinter.contracts]]
name = "the broker's policy core, store and audit log never import its daemon layer (S17)"
type = "forbidden"
source_modules = [
    "tumbleweed.broker.audit",
    "tumbleweed.broker.capabilities",
    "tumbleweed.broker.compose",
    "tumbleweed.broker.config",
    "tumbleweed.broker.deny",
    "tumbleweed.broker.errors",
    "tumbleweed.broker.fdio",
    "tumbleweed.broker.fsworker",
    "tumbleweed.broker.grants",
    "tumbleweed.broker.identity",
    "tumbleweed.broker.model",
    "tumbleweed.broker.paths",
    "tumbleweed.broker.policy",
    "tumbleweed.broker.privatefs",
    "tumbleweed.broker.prompts",
    "tumbleweed.broker.service",
    "tumbleweed.broker.store",
    "tumbleweed.broker.task",
    "tumbleweed.broker.toolblobs",
    "tumbleweed.broker.toolstore",
    "tumbleweed.broker.workspace",
    "tumbleweed.broker.workspaces",
]
forbidden_modules = [
    "tumbleweed.broker.service",
    "tumbleweed.broker.daemon",
    "tumbleweed.broker.client",
]

# The transport is the broker's and the shell's, and depends on neither: messages name IDs and
# plain text, and the broker maps them onto its own types.
[[tool.importlinter.contracts]]
name = "ipc never imports the broker (S17)"
type = "forbidden"
source_modules = ["tumbleweed.ipc"]
forbidden_modules = ["tumbleweed.broker"]

# The tool package model is pure data and canonical bytes, shared by the broker (which stores it)
# and the shell (which builds drafts and reads it): it knows neither of them, nor the transport.
[[tool.importlinter.contracts]]
name = "tools never imports broker, ipc, gi, agent, shell, voice or ui.gtk (S23)"
type = "forbidden"
source_modules = ["tumbleweed.tools"]
forbidden_modules = [
    "tumbleweed.broker",
    "tumbleweed.ipc",
    "tumbleweed.agent",
    "tumbleweed.shell",
    "tumbleweed.voice",
    "tumbleweed.ui.gtk",
    "gi",
]

[[tool.importlinter.contracts]]
name = "core never imports gi (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.core"]
forbidden_modules = ["gi"]

[[tool.importlinter.contracts]]
name = "ui.spec never imports gi (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.ui.spec"]
forbidden_modules = ["gi"]

# Indirect imports count, so the runtime cannot reach GTK through the adapter or the shell either.
[[tool.importlinter.contracts]]
name = "ui.runtime never imports gi, the GTK adapter or the shell (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.ui.runtime"]
forbidden_modules = ["gi", "tumbleweed.ui.gtk", "tumbleweed.shell"]

# The image rules (what may be decoded, and what a resolver must do) are checked in tests without a
# display, and the broker's resolver (S19) implements them without GTK.
[[tool.importlinter.contracts]]
name = "ui.images never imports gi, the GTK adapter or the shell (D21)"
type = "forbidden"
source_modules = ["tumbleweed.ui.images"]
forbidden_modules = ["gi", "tumbleweed.ui.gtk", "tumbleweed.shell"]

[[tool.importlinter.contracts]]
name = "history never imports gi (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.history"]
forbidden_modules = ["gi"]

# The shell depends on the history through `ChatHistory`, never the other way round.
[[tool.importlinter.contracts]]
name = "history never imports shell or agent (the shell depends on it, section 10)"
type = "forbidden"
source_modules = ["tumbleweed.history"]
forbidden_modules = ["tumbleweed.shell", "tumbleweed.agent"]

[[tool.importlinter.contracts]]
name = "agent never imports gi (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.agent"]
forbidden_modules = ["gi"]

[[tool.importlinter.contracts]]
name = "agent never imports shell: the shell depends on the agent through interfaces (section 10)"
type = "forbidden"
source_modules = ["tumbleweed.agent"]
forbidden_modules = ["tumbleweed.shell"]

# Indirect imports count: the view-model may not reach gi through any other module either, so it
# also cannot import the GTK adapter modules of tumbleweed.shell.
[[tool.importlinter.contracts]]
name = "the shell view-model never imports gi (section 10)"
type = "forbidden"
source_modules = ["tumbleweed.shell.viewmodel"]
forbidden_modules = ["gi"]

[[tool.importlinter.contracts]]
name = "ipc never imports gi (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.ipc"]
forbidden_modules = ["gi"]

# The launcher is confined code's jailer: it may not depend on whoever calls it (the broker builds
# a SandboxPolicy and hands it over) nor on anything that holds model output or a display.
[[tool.importlinter.contracts]]
name = "sandbox never imports broker, agent, shell, voice, ui.gtk, gi or an LLM SDK (ARCHITECTURE section 10)"
type = "forbidden"
source_modules = ["tumbleweed.sandbox"]
forbidden_modules = [
    "tumbleweed.broker",
    "tumbleweed.agent",
    "tumbleweed.shell",
    "tumbleweed.voice",
    "tumbleweed.ui.gtk",
    "gi",
    "anthropic",
    "openai",
    "litellm",
]

# The provider interface (`tumbleweed.agent.llm`) is what everything else uses; the SDK itself
# stays in the one module that adapts it (DECISIONS D3), so a proxy or another vendor replaces one
# file. Direct imports only: the shell reaches the SDK through the factory, which is the point. The
# SDK's HTTP library is also the speech client's (`tumbleweed.voice.whisper`, D20): one HTTP stack
# for the project (#43), in one module per use.
[[tool.importlinter.contracts]]
name = "the Anthropic SDK and its HTTP library are imported only by tumbleweed.agent.anthropic_provider (D3); httpx2 and httpcore2 also by tumbleweed.voice.whisper and .budget (D20)"
type = "forbidden"
source_modules = [
    "tumbleweed.agent",
    "tumbleweed.core",
    "tumbleweed.ipc",
    "tumbleweed.shell",
    "tumbleweed.ui",
    "tumbleweed.voice",
]
forbidden_modules = ["anthropic", "httpx2", "httpcore2"]
allow_indirect_imports = true
ignore_imports = [
    "tumbleweed.agent.anthropic_provider -> anthropic",
    "tumbleweed.agent.anthropic_provider -> httpx2",
    "tumbleweed.voice.whisper -> httpx2",
    "tumbleweed.voice.whisper -> httpcore2",
    "tumbleweed.voice.budget -> httpcore2",
]

# Voice (S06) is GTK-free except for its GStreamer adapter, where the stub gaps are confined (rule 7
# of CLAUDE.md); `_gst` is the one module that imports `gi`, and only `gstreamer` (the adapter) and
# `factory` (which imports it lazily, so that a host without GStreamer still starts) import `_gst`.
[[tool.importlinter.contracts]]
name = "voice imports gi only in its GStreamer adapter, tumbleweed.voice._gst (S06)"
type = "forbidden"
source_modules = ["tumbleweed.voice"]
forbidden_modules = ["gi"]
ignore_imports = ["tumbleweed.voice._gst -> gi"]

[[tool.importlinter.contracts]]
name = "voice never imports the shell or the broker: the shell depends on it (S06)"
type = "forbidden"
source_modules = ["tumbleweed.voice"]
forbidden_modules = ["tumbleweed.shell", "tumbleweed.broker"]

# A test (tests/voice/test_layering.py) checks that this list names every module of the package
# but the adapter, its pin and the factory.
[[tool.importlinter.contracts]]
name = "voice outside its GStreamer adapter and factory never imports the adapter (S06)"
type = "forbidden"
source_modules = [
    "tumbleweed.voice.audio",
    "tumbleweed.voice.budget",
    "tumbleweed.voice.config",
    "tumbleweed.voice.endpoint",
    "tumbleweed.voice.errors",
    "tumbleweed.voice.fake",
    "tumbleweed.voice.input",
    "tumbleweed.voice.limits",
    "tumbleweed.voice.output",
    "tumbleweed.voice.piper",
    "tumbleweed.voice.speakable",
    "tumbleweed.voice.stt",
    "tumbleweed.voice.tts",
    "tumbleweed.voice.whisper",
    "tumbleweed.voice.worker",
]
forbidden_modules = ["tumbleweed.voice.gstreamer", "tumbleweed.voice._gst"]

# The agent reads the `[voice]` table of the one configuration file (`agent.config` holds the loader,
# S06), so it may import the voice configuration model and nothing else of the voice package;
# `voice.factory` in turn imports `agent.config`, which is the loader and nothing more.
[[tool.importlinter.contracts]]
name = "agent imports voice only for its configuration model, tumbleweed.voice.config (S06)"
type = "forbidden"
source_modules = ["tumbleweed.agent"]
forbidden_modules = ["tumbleweed.voice"]
ignore_imports = ["tumbleweed.agent.config -> tumbleweed.voice.config"]

[[tool.importlinter.contracts]]
name = "voice imports the agent only in its factory, for the configuration loader and the errors (S06)"
type = "forbidden"
source_modules = ["tumbleweed.voice"]
forbidden_modules = ["tumbleweed.agent"]
ignore_imports = [
    "tumbleweed.voice.factory -> tumbleweed.agent.config",
    "tumbleweed.voice.factory -> tumbleweed.agent.errors",
]
